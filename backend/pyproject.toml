[project]
name = "govdocs-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "opensearch-py>=2.6",
    "boto3>=1.34",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "datasketch>=1.6",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "tenacity>=8.5",
    "strands-agents[openai]>=1.58.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/dms_core/src/dms_core",
    "packages/dms_adapters/src/dms_adapters",
    "services/api/src/dms_api",
    "services/workers/src/dms_workers",
    "packages/dms_agent/src/dms_agent",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
